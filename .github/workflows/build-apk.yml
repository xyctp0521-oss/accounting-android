name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install required SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" || sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK (capture log)
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          echo "BUILD_RC=$?" >> "$GITHUB_ENV"

      - name: Show build result
        if: always()
        run: echo "Build exit code = ${{ env.BUILD_RC }}"

      - name: Push build log to ci-logs branch for diagnosis
        if: always()
        run: |
          mkdir -p diag
          tail -n 300 android/build.log > diag/build-latest.log 2>/dev/null || echo "no build.log"
          git config user.email "ci@workbuddy.local"
          git config user.name "WorkBuddy CI"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -B ci-logs
          git add -f diag/build-latest.log
          git commit -m "[skip ci] build log" || echo "nothing to commit"
          git push origin ci-logs --force

      - name: Verify APK exists
        if: success()
        working-directory: android
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk && echo "APK OK" || (echo "APK MISSING"; exit 1)

      - name: Push APK to builds branch (fallback download)
        if: success()
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk xiaoyang-accounting.apk
          git config user.email "ci@workbuddy.local"
          git config user.name "WorkBuddy CI"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -B builds
          git add xiaoyang-accounting.apk
          git commit -m "build: APK $(date +%Y%m%d-%H%M%S)" || echo "no changes"
          git push origin builds --force
